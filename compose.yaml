
name: cardshop

services:

  # ==========================================
  # SQL SERVER DATABASE
  # ==========================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    ports:
      - "127.0.0.1:1434:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

    restart: unless-stopped

  # ==========================================
  # CARDSHOP API
  # ==========================================

  api:
    image: cardshop-api:1.0

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
    - dataprotection_keys:/root/.aspnet/DataProtection-Keys

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__CardShopDatabase: "Server=sqlserver,1433;Database=CardShopDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      Jwt__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES}"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped

# ==========================================
# PERSISTENT STORAGE
# ==========================================

volumes:
  sqlserver_data:
  dataprotection_keys: