
name: CardShop CI/CD

"on":
  push:
    branches:
      - main
      - dev
      - feature/docker

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # BUILD AND TEST
  # ==========================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest

        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
          MSSQL_PID: "Developer"

        ports:
          - 1433:1433

        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=40s

    env:
      CARDSHOP_TEST_SQLSERVER: "Server=127.0.0.1,1433;Database=CardShopConcurrencyTests;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};TrustServerCertificate=True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test CardShop.UnitTests/CardShop.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity quiet
          --logger "console;verbosity=normal"

      - name: Run integration tests
        run: >
          dotnet test CardShop.IntegrationTests/CardShop.IntegrationTests.csproj
          --configuration Release
          --no-build
          --verbosity quiet
          --logger "console;verbosity=normal"

  # ==========================================
  # BUILD AND PUBLISH DOCKER IMAGE
  # ==========================================

  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    needs: build-and-test

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
