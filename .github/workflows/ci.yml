
name: CardShop CI

"on":
  push:
    branches:
      - main
      - dev
      - feature/docker

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test CardShop.UnitTests/CardShop.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal
